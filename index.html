<!doctype html>
<html lang="en" dir="ltr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helping Hands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Telugu:wght@400;700&display=swap">
<style>

:root{
 --paper:#FBF7F0; --card:#FFFFFF; --ink:#1D2A24; --soft-ink:#3E4B44; --line:#E7DFD2;
 --leaf:#2F7A55; --leaf-d:#1E5239; --leaf-l:#E4F1E8; --sun:#F2B544; --sun-l:#FDF0D3; --clay:#D9774F; --clay-l:#FBE6DC; --sky:#5B8DB8; --sky-l:#E3EEF7; --tick:#1E8E3E;
 --head:"Fraunces",Georgia,"Times New Roman",serif; --body:"Atkinson Hyperlegible","Segoe UI",Verdana,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:21px;line-height:1.55}
h1,h2,h3{font-family:var(--head);font-weight:700;margin:0;line-height:1.15;letter-spacing:-.01em}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}
svg.i{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* header */
header{background:var(--leaf-d);color:#fff;position:sticky;top:0;z-index:10}
.bar{display:flex;align-items:center;gap:16px;padding-top:14px;padding-bottom:14px}
.brand{text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:12px;font-family:var(--head);font-size:30px;font-weight:700;background:none;border:0;color:#fff;padding:0}
.mark{width:46px;height:46px;border-radius:50%;background:var(--sun);display:grid;place-items:center}
.mark svg{width:28px;height:28px;stroke:var(--leaf-d);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
nav{display:flex;gap:8px;flex-wrap:wrap}
.nb{text-decoration:none;background:transparent;border:2px solid rgba(255,255,255,.28);color:#fff;border-radius:999px;padding:10px 20px;font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.nb svg.i{width:22px;height:22px}
.nb:hover{border-color:#fff}
.nb.on{background:#fff;color:var(--leaf-d);border-color:#fff}

/* home */
.hero{background:var(--leaf);color:#fff;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;padding-top:44px;padding-bottom:0}
.hero h1{font-size:58px;color:#fff}
.hero p{font-size:24px;margin:14px 0 28px;color:#EAF5EE}
.hero svg.art{width:100%;height:auto;display:block}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:-6px}
.choice{text-decoration:none;display:flex;flex-direction:column;align-items:flex-start;gap:10px;border:0;border-radius:28px;padding:30px 30px 28px;text-align:start;min-height:210px;transition:transform .15s}
.choice:hover{transform:translateY(-3px)}
.choice .ic{width:70px;height:70px;border-radius:22px;display:grid;place-items:center;background:rgba(255,255,255,.35)}
.choice .ic svg.i{width:40px;height:40px}
.choice b{font-family:var(--head);font-size:36px;line-height:1.1}
.choice span{font-size:20px}
.choice.can{background:var(--sun);color:#3A2A05}
.choice.need{background:var(--clay-l);color:#5A2410;border:3px solid var(--clay)}
.section{padding:40px 0 20px}
.lead{font-size:22px;color:var(--soft-ink);margin:8px 0 0}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}
.mini .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;margin-bottom:10px}
.mini h3{font-size:24px}
.mini p{margin:6px 0 0;font-size:19px;color:var(--soft-ink)}

/* pages */
.pagehead{padding:36px 0 10px}
.pagehead h1{font-size:46px;color:var(--leaf-d)}
.step{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:26px 28px;margin:22px 0}
.step h2{font-size:30px;display:flex;align-items:center;gap:14px;margin-bottom:6px}
.num{width:44px;height:44px;border-radius:50%;background:var(--leaf);color:#fff;font-family:var(--body);font-size:22px;font-weight:700;display:grid;place-items:center;flex:0 0 44px}
.hint{font-size:18px;color:var(--soft-ink);margin:0 0 16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.tile{-webkit-tap-highlight-color:transparent;display:flex;align-items:center;gap:12px;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:14px 16px;cursor:pointer;font-size:19px;line-height:1.3;user-select:none;transition:border-color .12s,background .12s}
.tile:hover{border-color:var(--leaf)}
.tile input{position:absolute;opacity:0;width:1px;height:1px}
.tile .box{width:30px;height:30px;flex:0 0 30px;border:3px solid var(--leaf);border-radius:7px;background:#fff;display:grid;place-items:center}
.tile .box svg{width:20px;height:20px;stroke:#fff;stroke-width:3.4;fill:none;opacity:0}
.tile .ti{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;background:var(--leaf-l);color:var(--leaf)}
.tile .ti svg.i{width:24px;height:24px}
.tile:has(input:checked){border-color:var(--leaf);background:var(--leaf-l)}
.tile:has(input:checked) .box{background:var(--tick);border-color:var(--tick)}
.tile:has(input:checked) .box svg{opacity:1}
.tile:has(input:focus-visible){outline:4px solid var(--sun);outline-offset:2px}
.person .av{width:40px;height:40px;flex:0 0 40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff}
.any{grid-column:1/-1;background:var(--sun-l);border-color:var(--sun)}
.note{background:var(--sun-l);border-radius:16px;padding:14px 18px;font-size:18px;margin-top:16px}
.field{margin-top:16px}
.field label{display:block;font-weight:700;margin-bottom:6px}
.field input{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--paper);font-size:20px}
.field input:focus{outline:none;border-color:var(--leaf);background:#fff}
.save{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;border:0;border-radius:20px;background:var(--leaf);color:#fff;font-family:var(--head);font-size:30px;padding:22px;margin:10px 0 50px}
.save:hover{background:var(--leaf-d)}
.err{color:#B3261E;font-weight:700;text-align:center;margin:-36px 0 40px}
.thanks{text-align:center;padding:60px 0}
.thanks .big{width:120px;height:120px;border-radius:50%;background:var(--leaf-l);display:grid;place-items:center;margin:0 auto 18px;color:var(--leaf)}
.thanks .big svg.i{width:66px;height:66px;stroke-width:2.4}
.thanks h1{font-size:52px;color:var(--leaf-d)}
.btn{text-decoration:none;display:inline-block;border:0;border-radius:999px;padding:16px 28px;font-weight:700;font-size:20px;background:var(--leaf);color:#fff}
.btn.light{background:var(--leaf-l);color:var(--leaf-d)}
.btn.red{background:var(--clay-l);color:#8A2F12}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.list{display:flex;flex-direction:column;gap:12px}
.item{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 18px;flex-wrap:wrap}
.item .txt{flex:1;min-width:200px}
.item small{display:block;color:var(--soft-ink);font-size:17px}
.empty{color:var(--soft-ink);font-size:19px}
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--soft-ink);font-size:18px}
footer .wrap{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.hlink{color:var(--leaf-d);text-decoration:underline;text-underline-offset:5px}.hlink:hover{color:var(--leaf)}
.lnk{font-size:18px;background:none;border:0;color:var(--leaf-d);text-decoration:underline;font-weight:700;padding:4px}
.rules ol{margin:0;padding-inline-start:34px;display:flex;flex-direction:column;gap:12px}

/* extra pieces for the real website */
.signin{max-width:640px;margin:50px auto;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:34px}
.signin h1{font-size:42px;color:var(--leaf-d)}
.signin .mark{width:70px;height:70px;margin-bottom:14px}.signin .mark svg{width:40px;height:40px}
.loading{text-align:center;padding:80px 0;color:var(--soft-ink)}
.okmsg{background:var(--leaf-l);border-radius:16px;padding:14px 18px;font-weight:700;margin-top:14px}
.warn{background:var(--clay-l);border-radius:16px;padding:14px 18px;margin:14px 0}
.tag{display:inline-block;background:var(--sun-l);border-radius:999px;padding:2px 12px;font-size:16px;font-weight:700;margin-inline-start:6px}
.safety{display:inline-block;background:#EEE;color:#555;border-radius:999px;padding:2px 12px;font-size:16px;font-weight:700}
.radio{display:flex;align-items:center;gap:12px;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:10px 0;cursor:pointer}
.radio:has(input:checked){border-color:var(--leaf);background:var(--leaf-l)}
.radio input{width:26px;height:26px;accent-color:var(--tick);flex:0 0 26px}
.code{font-family:Consolas,monospace;font-size:20px;background:var(--sun-l);padding:2px 10px;border-radius:8px;letter-spacing:.04em}
.small-field{max-width:200px}

/* language menu and other languages */
.topright{margin-inline-start:auto;flex:1 1 auto;display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
nav{justify-content:flex-end}
.langmenu{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.28);border-radius:999px;padding:4px 6px 4px 12px;color:#fff}
.langmenu svg.i{width:22px;height:22px}
.langmenu select{background:#fff;color:var(--leaf-d);border:0;border-radius:999px;padding:8px 12px;font-weight:700;font-size:18px;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tile input{inset-inline-start:0}
html[lang="ur"] body{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Urdu Typesetting",serif;line-height:2.1}
html[lang="ur"] h1,html[lang="ur"] h2,html[lang="ur"] h3,html[lang="ur"] .choice b,html[lang="ur"] .save{font-family:"Noto Nastaliq Urdu",serif;line-height:1.9;letter-spacing:0}
html[lang="hi"] body,html[lang="hi"] h1,html[lang="hi"] h2,html[lang="hi"] h3,html[lang="hi"] .choice b,html[lang="hi"] .save{font-family:"Noto Sans Devanagari","Atkinson Hyperlegible",sans-serif;letter-spacing:0}
html[lang="gu"] body,html[lang="gu"] h1,html[lang="gu"] h2,html[lang="gu"] h3,html[lang="gu"] .choice b,html[lang="gu"] .save{font-family:"Noto Sans Gujarati","Atkinson Hyperlegible",sans-serif;letter-spacing:0;line-height:1.6}
html[lang="ur"] .brand,html[lang="hi"] .brand,html[lang="gu"] .brand,.hero h1[dir="ltr"]{font-family:var(--head)}
html[dir="rtl"] .hero h1[dir="ltr"]{text-align:right}

/* groups, notes, away and PIN */
.grp{font-family:var(--head);font-size:24px;color:var(--leaf-d);margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.grp.first{margin-top:6px}
.away{display:block;font-size:15px;color:#8A5A00;font-weight:700;margin-top:2px}
.awaytag{background:var(--sun-l);color:#7A4E00}
.awaybox{background:var(--sun-l);border:2px solid var(--sun);border-radius:18px;padding:14px 18px;margin-top:22px;font-size:19px}
.awayrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:560px}
.pinbox{letter-spacing:.5em;font-size:24px!important;max-width:200px}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}

/* phones and small screens (kept last so it wins) */
@media (max-width:820px){
 .hero .wrap{grid-template-columns:1fr}.hero h1{font-size:42px}.choices,.three{grid-template-columns:1fr}
 .awayrow{grid-template-columns:1fr}
 .bar{flex-wrap:wrap}.topright{margin-inline-start:0;justify-content:flex-start}.topright nav{justify-content:flex-start}.pagehead h1{font-size:36px}header{position:static}
}

/* Who list: search box */
.whobar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0 12px}
.whobar .search{position:relative;flex:1;min-width:240px}
.whobar .search svg.i{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:24px;height:24px;color:#6B7A72}
.whobar .search input{width:100%;border:2px solid #B9C4BD;border-radius:14px;padding:12px 14px;padding-inline-start:48px;font-size:20px;background:#fff}
.whobar .search input:focus{border-color:var(--leaf);outline:none;box-shadow:0 0 0 4px var(--sun-l)}
.showall{background:#fff;border:2px solid var(--leaf);color:var(--leaf-d);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
.chosen{background:var(--leaf-l);border-radius:14px;padding:10px 16px;font-size:18px;margin-bottom:12px}
.chosen b{color:var(--leaf-d)}
.nomatch{color:#6B7A72;padding:14px 4px;margin:0}

/* Who list: street buttons and street under names */
.streets{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.streets button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-weight:700;font-size:17px;cursor:pointer;color:var(--ink)}
.streets button.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.tile .st{display:block;font-size:15px;color:#56635C;font-weight:400}
.item .st{color:#56635C}

/* Savings box, thank-you buttons, Home total */
.savebox{background:linear-gradient(135deg,var(--leaf-d),var(--leaf));color:#fff;border-radius:24px;padding:24px 28px;margin-top:22px}
.savebox .amt{font-family:var(--head);font-size:30px;font-weight:700;line-height:1.25}
.savebox p{margin:8px 0 0;color:#EAF5EE;font-size:18px}
.savebox .give{background:rgba(255,255,255,.14);border-radius:14px;padding:12px 16px;margin-top:14px;font-size:18px;color:#fff}
.thankbtn{background:var(--leaf);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:700;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 2px 0 var(--leaf-d)}
.thankbtn:hover{background:var(--leaf-d)}
.thankbtn svg.i{width:20px;height:20px;stroke-width:2.6}
.thanked{background:#fff;color:var(--leaf-d);border:2px solid var(--leaf-l);border-radius:999px;padding:6px 12px;font-size:15px;font-weight:700}
.hometotal{background:var(--leaf-l);border-radius:18px;padding:16px 20px;margin-top:22px;font-size:20px;text-align:center;color:var(--leaf-d);font-weight:700}
@media (max-width:640px){.savebox{padding:18px}.savebox .amt{font-size:28px}.item .thankbtn{width:100%;margin-top:8px}}
html[lang="ur"] .savebox .amt{font-family:"Noto Nastaliq Urdu",serif;line-height:1.9;letter-spacing:0}
html[lang="hi"] .savebox .amt{font-family:"Noto Sans Devanagari","Atkinson Hyperlegible",sans-serif;letter-spacing:0}
html[lang="gu"] .savebox .amt{font-family:"Noto Sans Gujarati","Atkinson Hyperlegible",sans-serif;letter-spacing:0;line-height:1.5}

/* ---- October 2026: folded sections, jump row, sticky "Next" bar, timing chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--leaf);background:#fff;color:var(--leaf-d);border-radius:999px;padding:9px 18px;font-weight:700;font-size:17px;cursor:pointer}
.chip.on{background:var(--leaf);color:#fff}
.jump{margin:14px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.jump button{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--leaf);background:#fff;color:var(--leaf-d);border-radius:999px;padding:8px 18px;font-size:17px;font-weight:700;cursor:pointer}
.jump button:hover,.jump button.has{background:var(--leaf-l)}
.jump .cnt{background:var(--tick,#1F8A4C);color:#fff;border-radius:999px;padding:0 8px;font-size:14px;font-style:normal;margin-inline-start:4px}
.sec{border:2px solid var(--line);border-radius:18px;margin-top:12px;background:#fff;scroll-margin-top:90px;overflow:hidden}
.sec>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 18px;cursor:pointer}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .grp{margin:0;padding:0;border:0;flex:1;font-size:22px}
.sec .meta{color:var(--soft-ink);font-size:16px;white-space:nowrap}.sec .meta b{color:var(--leaf-d)}
.sec .opener,.setting .opener{background:var(--leaf);color:#fff;border-radius:999px;padding:7px 14px;font-size:15px;font-weight:700;white-space:nowrap}
.sec[open]>summary{border-bottom:2px solid var(--line)}.sec .secbody{padding:6px 18px 16px}
.tray{position:sticky;bottom:0;z-index:15;margin-top:22px;background:var(--leaf-d);color:#fff;border-radius:22px 22px 0 0;padding:12px 20px;display:flex;align-items:center;gap:16px;box-shadow:0 -8px 24px rgba(0,0,0,.18)}
.tray .count{font-family:var(--head);font-size:22px;font-weight:700}
.tray .count small{display:block;font-family:var(--body);font-weight:400;font-size:15px;color:#DCEBE1}
.tray .go{margin-inline-start:auto;display:inline-flex;align-items:center;gap:8px;background:var(--sun);color:#3A2A05;border:0;border-radius:14px;padding:12px 22px;font-weight:700;font-size:19px;cursor:pointer;white-space:nowrap}
.tray .go svg.i{width:22px;height:22px;stroke-width:2.6}
.forwho{background:var(--leaf-l);border-color:var(--leaf)}.forwho h2{font-size:22px;margin-bottom:8px}
.forbadge{display:inline-block;background:var(--sun);color:#3A2A05;border-radius:999px;padding:2px 10px;font-size:15px;font-weight:700;vertical-align:middle}
.tray .forbadge{font-family:var(--body);margin-inline-end:6px}
.foodq{margin:10px 0 14px}.note.warn{background:#FFF4DF;border:2px solid var(--sun);color:var(--ink)}
.behalf{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
select{width:100%;border:2px solid #B9C4BD;border-radius:12px;padding:12px 14px;background:#fff;font-size:20px;font-family:inherit}
select.mini{width:auto;font-size:16px;padding:6px 10px;border-radius:10px}
/* ---- confirmation after Save */
.shows{font-size:18px;margin-top:10px}.shows .lnk{font-weight:400}
.conf{text-align:start;background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px 22px;margin:22px auto 0;max-width:720px}
.conf h2{font-size:22px;color:var(--leaf-d);margin:0 0 8px}
.conf .msg{white-space:pre-wrap;font-family:var(--body);font-size:18px;line-height:1.5;background:var(--leaf-l);border-radius:14px;padding:14px 16px;margin:0;overflow-wrap:anywhere}
.conf .hint.ok{color:var(--leaf-d);font-weight:700}
.conf .row{margin-top:10px;justify-content:flex-start}
.btn.wa{background:#25D366;color:#0B3D1E;display:inline-flex;align-items:center;gap:8px}.btn.wa:hover{background:#1EBE5A}.btn.wa svg.i{width:22px;height:22px}
.ok{color:var(--leaf-d);font-weight:700;align-self:center}
/* ---- My page: parts, two columns, fold-away settings, counts, hours */
.part{font-size:26px;color:var(--leaf-d);margin:34px 0 8px;padding-bottom:6px;border-bottom:3px solid var(--sun);scroll-margin-top:90px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}.twocol .step{margin-top:8px}
.setting{padding:0;scroll-margin-top:90px}
.setting>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 22px;cursor:pointer}
.setting>summary::-webkit-details-marker{display:none}
.setting>summary h2{font-size:22px;margin:0;flex:1}
.setting .cur{color:var(--leaf-d);font-weight:700;background:var(--leaf-l);border-radius:999px;padding:4px 12px;font-size:15px;white-space:nowrap;max-width:50%;overflow:hidden;text-overflow:ellipsis}
.setting[open]>summary{border-bottom:2px solid var(--line)}
.setting .setbody{padding:0 22px 22px}
.cnt2{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:var(--leaf);color:#fff;font-size:16px;font-weight:700;vertical-align:middle;font-family:var(--body)}
.btnrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
#savebox{scroll-margin-top:90px}.savebox .amt{font-size:26px}
.howtable{margin-top:12px;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 16px;color:#fff;font-size:17px}
.howtable summary{cursor:pointer;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px;list-style:none}
.howtable summary::-webkit-details-marker{display:none}

 "food", "meal": true}, {"label": "Sharing spare fruit and vegetables", "icon": "leaf", "meal": false}, {"label": "Toy swap", "icon": "swap", "meal": false}]}, {"key": "crisis", "title": {"en": "Times of crisis", "ur": "مشکل وقت", "hi": "संकट के समय", "gu": "કટોકટીનો સમય"}, "note": {"en": "Practical help and company only, in the family’s own way. Always ask the family what they would like, and respect their faith and customs. Only the family (or the person arranging the funeral) makes the decisions and registers the death – within 5 days of the medical examiner’s office confirming they can. In an emergency, call 999. Free support after a death: Cruse Bereavement Support, 0808 808 1677.", "ur": "صرف عملی مدد اور ساتھ، خاندان کے اپنے طریقے کے مطابق۔ ہمیشہ خاندان سے پوچھیں کہ وہ کیا چاہتے ہیں، اور ان کے مذہب اور رسم و رواج کا احترام کریں۔ فیصلے صرف خاندان (یا جنازے کا انتظام کرنے والا شخص) کرتا ہے اور وہی وفات کا اندراج کرواتا ہے – میڈیکل ایگزامنر کے دفتر کی اجازت ملنے کے 5 دن کے اندر۔ ہنگامی صورت میں 999 پر کال کریں۔ وفات کے بعد مفت سہارا: Cruse Bereavement Support، 0808 808 1677۔", "hi": "केवल व्यावहारिक मदद और साथ, परिवार के अपने तरीक़े से। हमेशा परिवार से पूछें कि वे क्या चाहते हैं, और उनके धर्म और रीति-रिवाज़ों का सम्मान करें। फ़ैसले केवल परिवार (या अंतिम संस्कार का इंतज़ाम करने वाला व्यक्ति) लेता है और वही मृत्यु का पंजीकरण कराता है – मेडिकल एग्ज़ामिनर के कार्यालय की पुष्टि के 5 दिन के अंदर। आपातकाल में 999 पर कॉल करें। मृत्यु के बाद मुफ़्त सहारा: Cruse Bereavement Support, 0808 808 1677।", "gu": "ફક્ત વ્યવહારુ મદદ અને સાથ, પરિવારની પોતાની રીતે. હંમેશાં પરિવારને પૂછો કે તેઓ શું ઇચ્છે છે, અને તેમના ધર્મ અને રીતરિવાજોનો આદર કરો. નિર્ણયો ફક્ત પરિવાર (કે અંતિમવિધિની ગોઠવણ કરનાર વ્યક્તિ) લે છે અને તેઓ જ મૃત્યુની નોંધણી કરાવે છે – મેડિકલ એક્ઝામિનરની ઑફિસ પુષ્ટિ આપે તેના 5 દિવસની અંદર. કટોકટીમાં 999 પર કૉલ કરો. અવસાન પછી મફત સહારો: Cruse Bereavement Support, 0808 808 1677."}, "items": [{"label": "Bringing meals to a family in mourning", "icon": "food", "meal": true}, {"label": "Company and practical help after an accident", "icon": "heart", "meal": false}, {"label": "Contacting the funeral director, mosque, temple, gurdwara, church or synagogue", "icon": "phone", "meal": false}, {"label": "Finding the register office and official help after a death", "icon": "pc", "meal": false}, {"label": "Helping the family make phone calls, if they wish", "icon": "phone", "meal": false}, {"label": "Helping to organise funeral rituals, with the family’s faith leader", "icon": "calendar", "meal": false}, {"label": "Lifts to the funeral", "icon": "car", "meal": false}, {"label": "Practical help after a death in the family", "icon": "heart", "meal": false}, {"label": "Welcoming visitors and making tea during mourning", "icon": "cup", "meal": false}]}, {"key": "home", "title": {"en": "Washing and the home", "ur": "کپڑوں کی دھلائی اور گھر", "hi": "कपड़ों की धुलाई और घर", "gu": "કપડાં ધોવાં અને ઘર"}, "note": {"en": "Sorting and tidying are done only with the owner there. The owner decides what is kept, where it goes and what is given away – nothing is thrown away without their say. Lift heavy things with two people, and use a step ladder only when someone is holding it.", "ur": "ترتیب اور صفائی صرف مالک کی موجودگی میں کی جاتی ہے۔ مالک ہی طے کرتا ہے کہ کیا رکھنا ہے، کہاں رکھنا ہے اور کیا دے دینا ہے – مالک کی مرضی کے بغیر کچھ نہیں پھینکا جاتا۔ بھاری چیزیں دو لوگ مل کر اٹھائیں، اور سیڑھی صرف تب استعمال کریں جب کوئی اسے پکڑے ہوئے ہو۔", "hi": "छँटाई और सफ़ाई केवल मालिक की मौजूदगी में की जाती है। मालिक ही तय करता है कि क्या रखना है, कहाँ रखना है और क्या दे देना है – मालिक की मर्ज़ी के बिना कुछ भी फेंका नहीं जाता। भारी चीज़ें दो लोग मिलकर उठाएँ, और सीढ़ी का इस्तेमाल तभी करें जब कोई उसे पकड़े हुए हो।", "gu": "ગોઠવણ અને સફાઈ ફક્ત માલિકની હાજરીમાં જ કરવામાં આવે છે. માલિક જ નક્કી કરે છે કે શું રાખવું, ક્યાં મૂકવું અને શું આપી દેવું – તેમની મરજી વિના કંઈ ફેંકાતું નથી. ભારે વસ્તુઓ બે જણ મળીને ઊંચકે, અને નિસરણી ત્યારે જ વાપરો જ્યારે કોઈ તેને પકડી રાખ્યું હોય."}, "i ِ کرم ہسپتال کے ملاقات کے اصولوں اور عملے کی ہدایات پر عمل کریں، اور اگر آپ خود بیمار ہوں تو ملنے نہ جائیں۔ اس شخص (یا ان کے گھر والوں) سے طے کریں کہ وہ کیا چاہتے ہیں۔", "hi": "केवल साथ और सहारा: हम चिकित्सा सलाह नहीं देते, चिकित्सा से जुड़े फ़ैसले नहीं लेते, और देखभाल (केयर) में हिस्सा नहीं लेते। सेहत से जुड़े किसी भी सवाल के लिए कृपया अपने GP से मिलें। कृपया अस्पताल के मुलाक़ात के नियमों और स्टाफ़ के निर्देशों का पालन करें, और अगर आप ख़ुद बीमार हों तो मिलने न जाएँ। उस व्यक्ति (या उनके परिवार) से तय करें कि वे क्या चाहते हैं।", "gu": "ફક્ત સાથ અને સહારો: અમે તબીબી સલાહ આપતા નથી, તબીબી નિર્ણયો લેતા નથી, અને સંભાળ (કેર) માં ભાગ લેતા નથી. આરોગ્યને લગતા કોઈ પણ સવાલ માટે કૃપા કરીને તમારા પોતાના GP ને મળો. કૃપા કરીને હૉસ્પિટલના મુલાકાતના નિયમો અને સ્ટાફની સૂચનાઓનું પાલન કરો, અને તમે પોતે બીમાર હો તો મળવા ન જાઓ. તે વ્યક્તિ (કે તેમના પરિવાર) સાથે નક્કી કરો કે તેઓ શું ઇચ્છે છે."}, "items": [{"label": "Daily hospital visits, for company and support", "icon": "hospital", "meal": false}, {"label": "Sitting with someone in A&E", "icon": "hospital", "meal": false}]}, {"key": "papers", "title": {"en": "Wills and important papers", "ur": "وصیت اور اہم کاغذات", "hi": "वसीयत और ज़रूरी काग़ज़ात", "gu": "વસિયતનામું અને અગત્યના કાગળો"}, "note": {"en": "Practical help only – we do not give legal or money advice. A will and a lasting power of attorney are made with a solicitor, who explains everything and arranges the signing and the witnesses. Members do not sign as witnesses, and do not keep anyone’s papers or passwords.", "ur": "صرف عملی مدد – ہم قانونی یا مالی مشورہ نہیں دیتے۔ وصیت اور لاسٹنگ پاور آف اٹارنی سولیسیٹر کے ذریعے بنتی ہیں، جو سب کچھ سمجھاتا ہے اور دستخطوں اور گواہوں کا انتظام کرتا ہے۔ ممبر گواہ کے طور پر دستخط نہیں کرتے، اور کسی کے کاغذات یا پاس ورڈ اپنے پاس نہیں رکھتے۔", "hi": "केवल व्यावहारिक मदद – हम क़ानूनी या पैसों से जुड़ी सलाह नहीं देते। वसीयत और लास्टिंग पावर ऑफ़ अटॉर्नी सॉलिसिटर के ज़रिए बनती हैं, जो सब कुछ समझाता है और दस्तख़त और गवाहों का इंतज़ाम करता है। सदस्य  news: {helper} will help you with {thing}. Please message {helper} on WhatsApp to arrange it. Helping Hands", "board.open": "Open – waiting for a helper", "board.takenBy": "{name} will help with this", "board.days": "{n} days on the board", "board.today": "On the board since today", "board.mine": "Your request", "board.notForMe": "Asked of others, not of you – but you may still help", "board.footer": "Who needs help", "board.counts": "{open} open · {taken} taken", "agreed.head": "Help I have agreed to give", "agreed.hint": "Message the person on WhatsApp to arrange the details. Press Done when it has happened.", "agreed.done": "Done", "agreed.cant": "I can’t after all", "agreed.cantDone": "The request is back on the board for someone else. Thank you for telling us.", "agreed.still": "Is {thing} with {name} still happening?", "agreed.stillYes": "Yes, still happening", "agreed.stillNo": "It has stopped", "agreed.regular": "Regular help – stays with you. Press Done each time, or “It has stopped” when it ends.", "cost.q": "Did you pay for anything? Real costs only (ingredients, shopping, tickets). Money is sent to the organisers’ bank account only, who pay the helper weekly. No tips are paid or accepted.", "cost.amount": "Amount (£)", "cost.what": "What it was for", "cost.none": "Nothing to repay", "cost.save": "Done – record the cost", "cost.noteH": "Money is sent to the organisers’ bank account only – never to the helper.", "cost.note": "The organiser records it and pays you once a week, on Friday. Time is never paid, and no tips are paid or accepted.", "cost.owe": "Real cost to repay: {amount} to Helping Hands (not to {helper}).", "cost.howPay": "Send it by bank transfer to the Helping Hands account only, using the reference shown. Never pay the helper directly, and please do not offer a tip – tips are not accepted.", "cost.ref": "Reference", "cost.paid": "I have paid", "cost.paidDone": "Thank you – the organiser will confirm it.", "cost.back": "Waiting to be paid back by Helping Hands: {amount} ({what}).", "cost.noBank": "The organiser has not yet typed the group’s bank details. Please ask them.", "costs.title": "Costs register", "costs.lead": "Organiser only. Every real cost in one place: what is owed to Helping Hands, what has come in, and what is paid out to helpers each Friday. Time is never paid; only real costs.", "costs.footer": "Costs register (organiser)", "costs.bankHead": "How members pay", "costs.bankHint": "These details show to members when they owe a real cost. Use a separate Helping Hands bank account, never a personal one.", "costs.bankName": "Account name", "costs.bankSort": "Sort code", "costs.bankNo": "Account number", "costs.bankSave": "Save", "costs.bankSaved": "Bank details saved.", "costs.owedHead": "Owed to Helping Hands", "costs.owedHint": "Money members still have to pay in.", "costs.inHead": "Received – waiting to go to the helper", "costs.inHint": "Paid in by members; goes to the helper on Friday.", "costs.outHead": "Paid out to helpers", "costs.outHint": "Weekly, on Friday. Keep the bank record with this list.", "costs.markIn": "Received", "costs.markOut": "Paid to helper", "costs.weekTotal": "To pay out this Friday: {amount}", "costs.owed": "Owed", "costs.said": "Member says paid", "costs.received": "Received", "costs.paidOut": "Paid to helper", "costs.none": "Nothing here at the moment.", "nudge.q": "Did {helper} help with {thing}?", "nudge.yes": "Yes – thank you", "nudge.notYet": "Not yet", "nudge.noNeed": "No longer needed", "nudge.hours": "About how long did it take?", "closed.head": "Closed requests", "closed.hint": "Closed when the help was done, when it was no longer needed, or automatically after 14 days. One tap puts any of them back on the board.", "closed.putBack": "Put it back on the board", "closed.done": "Done", "closed.noneed": "No longer needed", "closed.auto": "Closed automatically", "closed.until": "Closed on the Until date", "closed.stopped": "Stopped", "closed.organiser": "Taken off the board by the organiser", "closed.autoNote": "A request closes itself 14 days after it was accepted if nobody presses Done, and the thank-you is still counted. Regular help (every week, every day, long-term) stays with the helper; every 8 weeks both of you are asked “Is this still happening?”. A request with an Until date closes on that date.", "tell.head": "Tell the organiser", "tell.hint": "Only the organiser will see this. For example: something went wrong, someone asked for payment, or someone may need more help than the group can give.", "tell.send": "Send privately", "tell.sent": "Thank you. Only the organiser will see this.", "tell.bigNeeds": "If someone needs regular care, or seems unwell or in difficulty, please tell the organiser. We will help them find the right service. The group does not give advice.", "care.title": "Group care", "care.lead": "Organiser only. Quiet things that may need a kind word. Members never see this page, and nothing here is shown to anyone else.", "care.footer": "Group care (organiser)", "care.untakenHead": "Requests nobody has taken for 3 days or more", "care.untakenHint": "You may like to ask someone personally.", "care.notYetHead": "Help that did not happen yet", "care.notYetHint": "The person answered “Not yet”. The request went back on the board. Nobody is named or blamed.", "care.notYetLine": "{thing} – {n} time(s)", "care.oftenHead": "Members who have asked for help often lately", "care.oftenHint": "They may be going through a hard time. A kind, private word may help – or help to find the right service. This is never shown to members.", "care.oftenLine": "{n} requests in the last 4 weeks", "care.msgsHead": "Messages to the organiser", "care.msgsHint": "Sent privately with “Tell the organiser”.", "care.msgDone": "Dealt with", "care.quietHead": "Members not signed in for 6 months", "care.quietHint": "They are sent one gentle email: “Are you still with us?” You may like to check before removing anyone.", "care.lastSeen": "Last signed in {date}", "care.neverSeen": "Not signed in yet", "care.asked": "Email sent", "care.takeOff": "Take off the board", "care.takenOff": "Taken off the board.", "care.guide": "If something goes wrong: listen to both people privately, stay kind and neutral, never take sides in public, and remind everyone of Our simple rules. If someone asks for payment for their time, gently remind them that help is free and only real costs are shared. If anyone may be at risk, call 999.", "members.showCode": "Show code", "members.hideCode": "Hide code", "members.codeHint": "Codes are shown only to organisers, and only when you press Show code. Send each code privately.", "members.newCode": "New code", "members.newCodeSure": "Sure? Tap again – the old code stops working at once.", "members.newCodeDone": "{name}’s new code is {code}. The old code no longer works. Send the new one privately.", "members.makeOrg": "Make organiser", "members.stopOrg": "Stop being organiser", "members.orgDone": "{name} is now an organiser too.", "members.orgStopped": "{name} is no longer an organiser.", "members.lastSeen": "Last signed in {date}", "members.organiserTag": "organiser", "sure.tap": "Sure? Tap again", "list.removed": "Removed – members do not see this", "list.restore": "Restore", "list.restored": "“{label}” is back on the list.", "list.removedMsg": "“{label}” has been removed. Press Restore to bring it back.", "list.restoreHint": "Removed things stay here in grey with a Restore button, so nothing is ever lost. Ticks people had already saved come back with it.", "list.refused": "That cannot be added: the group does no dog walking and gives no medical help.", "prosm.papersHead": "Step 3 – What the organisers have checked", "prosm.papersHint": "The papers themselves (CV, passport or share code, references, insurance) are kept in the organisers’ offline ledger – never on the website. Tick what you have seen. Members see only a line saying the checks were done.", "prosm.seenCv": "CV seen", "prosm.seenRtw": "Right to work in the UK seen (passport or share code)", "prosm.seenRefs": "Two references spoken to", "prosm.seenIns": "Public liability insurance seen", "prosm.reg": "Trade register number (optional – Gas Safe, NICEIC or similar)", "prosm.selfEmp": "Self-employed – sends their own invoice (no PAYE)", "prosm.needAll": "Please tick CV, right to work, references and insurance before adding.", "prosm.away": "Away for now – members do not see this", "prosm.removeBtn": "Remove", "prosm.restore": "Restore", "prosm.removedMsg": "{name} is removed for now. Press Restore when they are back.", "prosm.restoredMsg": "{name} is back on the list.", "pros.checksLine": "Checked by the organisers: CV ✔ · right to work ✔ · two references ✔ · insurance ✔", "pros.ledger": "Papers in the organisers’ offline ledger", "pros.regLine": "Register number: {n}", "pros.introVet": "Every professional listed here is fully vetted, experienced and trustworthy: the organisers have seen their CV, proof of their right to work in the UK and their insurance, and have spoken to two references, before their name and number appear. They are self-employed; any work is an agreement between you and them.", "links.addHead": "Add a link", "links.addBtn": "Add link", "links.added": "Link added.", "links.removed": "Removed – members do not see this. Press Restore to bring it back.", "links.restore": "Restore", "links.remove": "Remove", "links.live": "Live – members see this", "links.orgOnly": "Only organisers can add, remove or restore links. Members only see the links that are live.", "links.urlBad": "The address must start with https://", "listen.head": "Our listeners", "listen.text": "People from outside the group are happy to take a phone call from anyone who feels lonely or in distress. They are not members, so nothing you say reaches the group. Everything is fully confidential.", "listen.none": "Their numbers will be added here by the organiser.", "listen.hours": "Usually answers:", "listen.editHead": "Our listeners (organiser)", "listen.editHint": "First name, phone number and the hours they usually answer. Up to six. They show on the Rules page and the Cooking for others page.", "listen.name": "First name", "listen.phone": "Phone", "listen.hoursLabel": "Hours (optional)", "listen.save": "Save listeners", "listen.saved": "Listeners saved.", "talk.head": "Need someone to talk to?", "talk.text": "If you feel low, lonely or in distress, you are not alone. Samaritans listen any time, free, on 116 123. For urgent mental health help, call NHS 111 and choose the mental health option. In an emergency call 999.", "cook.title": "Cooking for others", "cook.lead": "For everyone who prepares food for another household. Please read it once, and again before you cook for someone new.", "cook.footer": "Cooking for others", "cook.hygHead": "Food hygiene", "cook.hygText": "Everyone who cooks for others in the group is asked to complete a short online food hygiene course first. It takes about two hours and teaches safe storing, cooking, cooling and reheating.", "cook.hygLink": "Level 2 Food Hygiene and Safety course (High Speed Training) – opens in a new tab", "cook.hygFee": "The course fee is reimbursed by the organiser: send the receipt to the organiser after you pass. Someone in the group who has already passed the course is happy to help others through it – ask the organiser who.", "cook.allHead": "General Food Allergens", "cook.allIntro": "This is a general list of the foods that most often cause allergic reactions. Some specific allergens may be missing from this list – always ask the person what they must avoid, and when in doubt, do not cook for them. Our rule stays: no home-cooked meals for anyone who has a food allergy.", "cook.allNote": "The first fourteen are the allergens that UK food businesses must declare by law; home cooks are not businesses, but the same care applies.", "cook.diaHead": "Cooking for someone with diabetes", "cook.diaText": "Many members live with diabetes. This is not medical advice – only awareness for the cook. Ask the person what they usually eat and what they avoid; they know best. Tell them plainly what is in the dish, especially sugar, honey, syrups, white rice, white bread, potatoes and sweet drinks, and how big the portion is. Do not change anyone’s food or medicines on your own idea. For any health question, the person should ask their own GP, pharmacist or diabetes nurse.", "cook.labelHead": "Label every dish", "cook.labelText": "Write what is in each dish on a card or a sticker: the main ingredients, any of the allergens above, and whether it has sugar in it. At food gatherings every dish is labelled, so people can choose safely.", "cook.a1": "Celery", "cook.a1d": "including celeriac, and celery in stock cubes, soups and salts", "cook.a2": "Cereals containing gluten", "cook.a2d": "wheat, rye, barley, oats and spelt – in bread, pasta, flour, batter, couscous, many sauces", "cook.a3": "Crustaceans", "cook.a3d": "prawns, crab, lobster, crayfish, shrimp paste", "cook.a4": "Eggs", "cook.a4d": "including in cakes, mayonnaise, pastry glaze, some pasta and sauces", "cook.a5": "Fish", "cook.a5d": "including fish sauce, Worcestershire sauce, some salad dressings", "cook.a6": "Lupin", "cook.a6d": "in some breads, pastries and pasta", "cook.a7": "Milk", "cook.a7d": "including butter, cheese, cream, yoghurt, ghee, milk powder, whey", "cook.a8": "Molluscs", "cook.a8d": "mussels, squid, snails, oysters, oyster sauce", "cook.a9": "Mustard", "cook.a9d": "seeds, powder, leaves, and in curries, marinades, dressings", "cook.a10": "Peanuts", "cook.a10d": "groundnut oil, peanut butter, satay, many sweets and sauces", "cook.a11": "Sesame", "cook.a11d": "seeds, oil, tahini, hummus, some breads", "cook.a12": "Soya", "cook.a12d": "soy sauce, tofu, edamame, soya milk, some desserts and sauces", "cook.a13": "Sulphur dioxide and sulphites", "cook.a13d": "in dried fruit, some meat products, soft drinks, vinegar, wine", "cook.a14": "Tree nuts", "cook.a14d": "almonds, hazelnuts, walnuts, cashews, pecans, Brazil nuts, pistachios, macadamia – in oils, marzipan, pesto, sauces", "cook.a15": "Other allergens people report", "cook.a15d": "for example kiwi, banana, avocado, chickpeas, lentils, certain spices, food colourings – always ask", "allergy.all": "Everyone in {name}’s home has a food allergy, so home-cooked meals are not provided for that home.", "allergy.some": "Someone in {name}’s home has a food allergy. Home-cooked meals are not provided for that person, but are happily provided for the {n} people in the home who have no food allergy – please label every dish with what is in it.", "allergy.some1": "Someone in {name}’s home has a food allergy. Home-cooked meals are not provided for that person, but are happily provided for the one person in the home who has no food allergy – please label every dish with what is in it.", "rules.10": "Keep to the help requested or accepted. The website, the board and the group chats are not for chit-chat or general discussion.", "rules.11": "The privacy of every household is strictly respected. What you see or hear in someone’s home stays there, and is never discussed with others.", "rules.12": "No dog walking, and no home-cooked meals for anyone who has a food allergy (meals are happily cooked for the others in that home).", "priv.title": "Privacy notice", "priv.lead": "What this website keeps about you, why, and who can see it. Written in plain words.", "priv.footer": "Privacy", "priv.h1": "What we keep", "priv.t1": "Your first name; the street name and postcode area you choose to give; your email (for confirmations); the family member or friend you choose to keep informed; your answer to the food question; what you offer and ask for, and when; thank-yous and real costs; the professionals the group uses. Nothing else.", "priv.h2": "Why", "priv.t2": "So that members can see who offers and needs help, so that confirmations reach you, so that cooked food is safe, and so that real costs are repaid through the organisers. We never sell or share your details with anyone outside the group.", "priv.h3": "Your food answer", "priv.t3": "Whether anyone in your home has a food allergy is health information. We keep it only because you tick the box to say we may, and only to keep food safe. Only you and the organisers can see it; other members see only “not available for safety reasons”. You can change or clear it at any time on My page.", "priv.h4": "Who can see what", "priv.t4": "Members see first names, street names, offers, requests and the professionals. Organisers also see invite codes, emails, family contacts, the costs register, the journal and the group-care page. Nobody outside the group sees anything.", "priv.h5": "How long", "priv.t5": "While you are a member, and for 12 months after you leave (so that costs and thank-yous add up correctly), then deleted. The organisers’ journal is kept for the life of the group, with codes instead of names.", "priv.h6": "Papers about professionals", "priv.t6": "CVs, passports and references are kept in the organisers’ offline ledger, not on this website.", "priv.h7": "Your rights", "priv.t7": "You can ask the organisers at any time to see what is kept about you, to correct it, or to delete it. Just ask.", "priv.h8": "Safety", "priv.t8": "The website is private, reached only with an invite code and an optional PIN, backed up daily, and uses no tracking or advertising cookies.", "terms.title": "Terms of use", "terms.lead": "A short, plain agreement between every member and the group.", "terms.footer": "Terms", "terms.1": "Helping Hands is a voluntary group of people who help each other. Nobody is paid for their time; only real costs are repaid, through the organisers’ bank account, and no tips are paid or accepted.", "terms.2": "Helping is always your choice, and so is asking. Saying no is always fine.", "terms.3": "The website is private. Keep your invite code to yourself; never share it or the website address with anyone outside the group.", "terms.4": "Use the website only for the help requested or accepted – not for chit-chat, selling, politics or anything else.", "terms.5": "Respect every household’s privacy. What you see or hear in someone’s home stays there.", "terms.6": "We do not give medical, legal or money advice. For any health question see your own GP, a pharmacist or NHS 111. In an emergency call 999.", "terms.7": "The trusted professionals are independent, self-employed people checked by the organisers. Any work they do is an agreement between you and them.", "terms.8": "The organisers may remove a request, a professional or a member who breaks these terms, after speaking to them.", "terms.9": "By using the website you agree to these terms and to the Privacy notice.", "uc.title": "Useful contacts", "uc.lead": "Who to call around us. Nothing here is advice – it is a phone book.", "uc.leadOrg": "Organiser only unless you tick “Show to members too”. Add, change, remove and restore as things change.", "uc.footer": "Useful contacts", "uc.footerOrg": "Useful contacts (organiser)", "uc.name": "Name", "uc.phone": "Phone", "uc.note": "One line (optional)", "uc.cat": "Which list?", "uc.add": "Add", "uc.added": "Added.", "uc.remove": "Remove", "uc.restore": "Restore", "uc.removed": "Removed – press Restore to bring it back.", "uc.show": "Show to members too", "uc.showHint": "When this is ticked, members see the Useful contacts page as well (without the Add, Remove and Restore buttons).", "uc.none": "Nothing here yet.", "uc.c.emergency": "Emergencies", "uc.c.health": "Hospitals, GP surgeries and pharmacies", "uc.c.faith": "Faith leaders and places of worship", "uc.c.funeral": "When someone dies", "uc.c.shops": "Local shops that deliver or take orders", "uc.c.council": "Council, police (non-emergency) and advice", "uc.c.transport": "Transport", "uc.c.support": "Support and companionship", "uc.c.school": "Schools and libr یں۔ ذہنی صحت کی فوری مدد کے لیے NHS 111 پر کال کریں اور ذہنی صحت کا آپشن چنیں۔ ہنگامی حالت میں 999 پر کال کریں۔", "cook.title": "دوسروں کے لیے کھانا پکانا", "cook.lead": "ہر اس شخص کے لیے جو کسی دوسرے گھر کے لیے کھانا تیار کرتا ہے۔ براہِ کرم اسے ایک بار پڑھیں، اور کسی نئے شخص کے لیے پکانے سے پہلے دوبارہ پڑھیں۔", "cook.footer": "دوسروں کے لیے کھانا پکانا", "cook.hygHead": "کھانے کی صفائی", "cook.hygText": "گروپ میں جو بھی دوسروں کے لیے کھانا پکاتا ہے اس سے کہا جاتا ہے کہ پہلے کھانے کی صفائی کا ایک مختصر آن لائن کورس مکمل کرے۔ اس میں تقریباً دو گھنٹے لگتے ہیں اور یہ محفوظ طریقے سے رکھنا، پکانا، ٹھنڈا کرنا اور دوبارہ گرم کرنا سکھاتا ہے۔", "cook.hygLink": "لیول 2 کھانے کی صفائی اور حفاظت کا کورس (High Speed Training) – نئے ٹیب میں کھلتا ہے", "cook.hygFee": "کورس کی فیس منتظم واپس کرتے ہیں: پاس ہونے کے بعد رسید منتظم کو بھیجیں۔ گروپ میں ایک شخص جو یہ کورس پہلے ہی پاس کر چکا ہے، خوشی سے دوسروں کی اس میں مدد کرتا ہے – منتظم سے پوچھیں کہ کون۔", "cook.allHead": "عام کھانے کی الرجی والی چیزیں", "cook.allIntro": "یہ ان کھانوں کی عام فہرست ہے جو اکثر الرجی کا ردِعمل پیدا کرتے ہیں۔ کچھ خاص الرجی والی چیزیں اس فہرست میں نہ بھی ہوں – ہمیشہ اس شخص سے پوچھیں کہ اسے کس چیز سے بچنا ہے، اور شک ہو تو اس کے لیے کھانا نہ پکائیں۔ ہمارا اصول قائم ہے: جسے کھانے سے الرجی ہو اس کے لیے گھر کا پکا کھانا نہیں۔", "cook.allNote": "پہلی چودہ وہ چیزیں ہیں جو برطانیہ کے کھانے کے کاروباروں کو قانوناً بتانی ہوتی ہیں؛ گھر میں پکانے والے کاروبار نہیں ہیں، لیکن وہی احتیاط لاگو ہوتی ہے۔", "cook.diaHead": "ذیابیطس والے شخص کے لیے کھانا پکانا", "cook.diaText": "بہت سے ممبر ذیابیطس کے ساتھ رہتے ہیں۔ یہ طبی مشورہ نہیں ہے – صرف پکانے والے کے لیے آگاہی ہے۔ اس شخص سے پوچھیں کہ وہ عموماً کیا کھاتے ہیں اور کس چیز سے پرہیز کرتے ہیں؛ وہ بہتر جانتے ہیں۔ انہیں صاف صاف بتائیں کہ کھانے میں کیا ہے، خاص طور پر چینی، شہد، شربت، سفید چاول، سفید ڈبل روٹی، آلو اور میٹھے مشروبات، اور حصہ کتنا بڑا ہے۔ اپنی مرضی سے کسی کا کھانا یا دوائیں نہ بدلیں۔ صحت کے کسی بھی سوال کے لیے اس شخص کو اپنے GP، فارماسسٹ یا ذیابیطس کی نرس سے پوچھنا چاہیے۔", "cook.labelHead": "ہر ڈش پر لیبل لگائیں", "cook.labelText": "ہر ڈش میں کیا ہے یہ ایک کارڈ یا اسٹیکر پر لکھیں: اہم اجزا، اوپر دی گئی الرجی والی چیزوں میں سے کوئی بھی، اور کیا اس میں چینی ہے۔ کھانے کی محفلوں میں ہر ڈش پر لیبل ہوتا ہے، تاکہ لوگ محفوظ طریقے سے چن سکیں۔", "cook.a1": "سیلری (اجوائن کا ساگ)", "cook.a1d": "بشمول سیلری کی جڑ، اور اسٹاک کیوب، سوپ اور نمک میں سیلری", "cook.a2": "گلوٹن والے اناج", "cook.a2d": "گندم، رائی، جَو، جئی اور اسپیلٹ – ڈبل روٹی، پاستا، آٹا، بیٹر، کسکس، بہت سی چٹنیوں میں", "cook.a3": "خول والے سمندری جاندار (جھینگا، کیکڑا)", "cook.a3d": "جھینگے، کیکڑا، لابسٹر، کرے فش، جھینگوں کا پیسٹ", "cook.a4": "انڈے", "cook.a4d": "بشمول کیک، مایونیز، پیسٹری کی چمک، کچھ پاستا اور چٹنیوں میں", "cook.a5": "مچھلی", "cook.a5d": "بشمول فش ساس، ووسٹر ساس، کچھ سلاد ڈریسنگ", "cook.a6": "لوپن", "cook.a6d": "کچھ ڈبل روٹیوں، پیسٹریوں اور پاستا میں", "cook.a7": "دودھ", "cook.a7d": "بشمول مکھن، پنیر، کریم، دہی، گھی، خشک دودھ، وہے", "cook.a8": "نرم جسم والے سمندری جاندار (سیپ، سکویڈ)", "cook.a8d": "مسلز، سکویڈ، گھونگے، اوئسٹر، اوئسٹر ساس", "cook.a9": "سرسوں", "cook.a9d": "بیج، پاؤڈر، پتے، اور سالن، میرینیڈ، ڈریسنگ میں", "cook.a10": "مونگ پھلی", "cook.a10d": "مونگ پھلی کا تیل، پینٹ بٹر، ساٹے، بہت سی مٹھائیاں اور چٹنیاں", "cook.a11": "تِل", "cook.a11d": "بیج، تیل، طاحینی، حمص، کچھ ڈبل روٹیاں", "cook.a12": "سویا", "cook.a12d": "سویا ساس، ٹوفو، ایڈامامے، سویا دودھ، کچھ میٹھے اور چٹنیاں", "cook.a13": "سلفر ڈائی آکسائیڈ اور سلفائٹس", "cook.a13d": "خشک میوے، کچھ گوشت کی مصنوعات، سافٹ ڈرنکس، سرکہ، شراب میں", "cook.a14": "درختوں کے میوے", "cook.a14d": "بادام، ہیزل نٹ، اخروٹ، کاجو، پیکان، برازیل نٹ، پستہ، میکاڈیمیا – تیل، مارزیپان، پیسٹو، چٹنیوں میں", "cook.a15": "دیگر چیزیں جن سے لوگ الرجی بتاتے ہیں", "cook.a15d": "مثلاً کیوی، کیلا، ایواکاڈو، چنے، دالیں، کچھ مصالحے، کھانے کے رنگ – ہمیشہ پوچھیں", "allergy.all": "{name} کے گھر میں سب کو کھانے سے الرجی ہے، اس لیے اس گھر کے لیے گھر کا پکا کھانا فراہم نہیں کیا جاتا۔", "allergy.some": "{name} کے گھر میں کسی کو کھانے سے الرجی ہے۔ اس شخص کے لیے گھر کا پکا کھانا فراہم نہیں کیا جاتا، لیکن گھر کے ان {n} لوگوں کے لیے خوشی سے دیا جاتا ہے جنہیں کھانے سے الرجی نہیں – براہِ کرم ہر ڈش پر لکھیں کہ اس میں کیا ہے۔", "allergy.some1": "{name} کے گھر میں کسی کو کھانے سے الرجی ہے۔ اس شخص کے لیے گھر کا پکا کھانا فراہم نہیں کیا جاتا، لیکن گھر کے اس ایک شخص کے لیے خوشی سے دیا جاتا ہے جسے کھانے سے الرجی نہیں – براہِ کرم ہر ڈش پر لکھیں کہ اس میں کیا ہے۔", "rules.10": "صرف مانگی گئی یا قبول کی گئی مدد تک محدود رہیں۔ ویب سائٹ، بورڈ اور گروپ کی چیٹس گپ شپ یا عام بحث کے لیے نہیں ہیں۔", "rules.11": "ہر گھر کی رازداری کا سختی سے احترام کیا جاتا ہے۔ کسی کے گھر میں آپ جو دیکھیں یا سنیں وہ وہیں رہتا ہے، اور کبھی دوسروں سے اس پر بات نہیں کی جاتی۔", "rules.12": "کتے ٹہلانے کا کوئی کام نہیں، اور جسے کھانے سے الرجی ہو اس کے لیے گھر کا پکا کھانا نہیں (اس گھر کے باقی لوگوں کے لیے خوشی سے کھانا پکایا جاتا ہے)۔", "priv.title": "رازداری کا نوٹس", "priv.lead": "یہ ویب سائٹ آپ کے بارے میں کیا رکھتی ہے، کیوں، اور کون اسے دیکھ سکتا ہے۔ آسان لفظوں میں لکھا ہوا۔", "priv.footer": "رازداری", "priv.h1": "ہم کیا رکھتے ہیں", "priv.t1": "آپ کا پہلا نام؛ گلی کا نام اور پوسٹ کوڈ کا علاقہ جو آپ دینا چاہیں؛ آپ کی ای میل (تصدیقوں کے لیے)؛ گھر کا وہ فرد یا دوست جسے آپ باخبر رکھنا چاہیں؛ کھانے کے سوال کا آپ کا جواب؛ آپ کیا پیش کرتے اور مانگتے ہیں، اور کب؛ شکریے اور اصل خرچ؛ وہ پیشہ ور جنہیں گروپ استعمال کرتا ہے۔ اور کچھ نہیں۔", "priv.h2": "کیوں", "priv.t2": "تاکہ ممبر دیکھ سکیں کہ کون مدد پیش کرتا ہے اور کسے چاہیے، تاکہ تصدیقیں آپ تک پہنچیں، تاکہ پکا ہوا کھانا محفوظ رہے، اور تاکہ اصل خرچ منتظمین کے ذریعے واپس ہو۔ ہم آپ کی تفصیلات گروپ سے باہر کسی کو کبھی نہیں بیچتے اور نہ بانٹتے ہیں۔", "priv.h3": "کھانے کا آپ کا جواب", "priv.t3": "آپ کے گھر میں کسی کو کھانے سے الرجی ہے یا نہیں، یہ صحت کی معلومات ہے۔ ہم اسے صرف اس لیے رکھتے ہیں کہ آپ خانے پر نشان لگا کر اجازت دیتے ہیں، اور صرف کھانے کو محفوظ رکھنے کے لیے۔ اسے صرف آپ اور منتظمین دیکھ سکتے ہیں؛ دوسرے ممبر صرف “حفاظتی وجوہات سے دستیاب نہیں” دیکھتے ہیں۔ آپ اسے میرا صفحہ پر کسی بھی وقت بدل یا مٹا سکتے ہیں۔", "priv.h4": "کون کیا دیکھ سکتا ہے", "priv.t4": "ممبر پہلے نام، گلیوں کے نام، پیشکشیں، درخواستیں اور پیشہ ور دیکھتے ہیں۔ منتظمین دعوتی کوڈ، ای میل، گھر والوں کے رابطے، خرچ کا رجسٹر، روزنامچہ اور گروپ کی دیکھ بھال کا صفحہ بھی دیکھتے ہیں۔ گروپ سے باہر کوئی کچھ نہیں دیکھتا۔", "priv.h5": "کتنی دیر", "priv.t5": "جب تک آپ ممبر ہیں، اور آپ کے جانے کے 12 ماہ بعد تک (تاکہ خرچ اور شکریے صحیح جمع ہوں)، پھر مٹا دیا جاتا ہے۔ منتظمین کا روزنامچہ گروپ کی پوری زندگی تک رکھا جاتا ہے، ناموں کی جگہ کوڈ کے ساتھ۔", "priv.h6": "پیشہ وروں کے کاغذات", "priv.t6": "CV، پاسپورٹ اور حوالے منتظمین کے آف لائن کھاتے میں رکھے جاتے ہیں، اس ویب سائٹ پر نہیں۔", "priv.h7": "آپ کے حقوق", "priv.t7": "آپ کسی بھی وقت منتظمین سے کہہ سکتے ہیں کہ آپ کے بارے میں جو رکھا گیا ہے وہ دکھائیں، اسے درست کریں، یا مٹا دیں۔ بس کہہ دیں۔", "priv.h8": "حفاظت", "priv.t8": "ویب سائٹ نجی ہے، صرف دعوتی کوڈ اور اختیاری PIN سے کھلتی ہے، روزانہ اس کا بیک اپ لیا جاتا ہے، اور یہ کوئی ٹریکنگ یا اشتہاری کوکیز استعمال نہیں کرتی۔", "terms.title": "استعمال کی شرائط", "terms.lead": "ہر ممبر اور گروپ کے درمیان ایک مختصر، سادہ معاہدہ۔", "terms.footer": "شرائط", "terms.1": "Helping Hands ایک رضاکارانہ گروپ ہے جس میں لوگ ایک دوسرے کی مدد کرتے ہیں۔ کسی کو اپنے وقت کے پیسے نہیں دیے جاتے؛ صرف اصل خرچ واپس کیا جاتا ہے، منتظمین کے بینک اکاؤنٹ کے ذریعے، اور کوئی ٹِپ نہ دی جاتی ہے نہ لی جاتی ہے۔", "terms.2": "مدد کرنا ہمیشہ آپ کی مرضی ہے، اور مانگنا بھی۔ نہ کہنا ہمیشہ ٹھیک ہے۔", "terms.3": "ویب سائٹ نجی ہے۔ اپنا دعوتی کوڈ اپنے پاس رکھیں؛ اسے یا ویب سائٹ کا ایڈریس گروپ سے باہر کسی کے ساتھ کبھی نہ بانٹیں۔", "terms.4": "ویب سائٹ صرف مانگی گئی یا قبول کی گئی مدد کے لیے استعمال کریں – گپ شپ، چیزیں بیچنے، سیاست یا کسی اور چیز کے لیے نہیں۔", "terms.5": "ہر گھر کی رازداری کا احترام کریں۔ کسی کے گھر میں آپ جو دیکھیں یا سنیں وہ وہیں رہتا ہے۔", "terms.6": "ہم طبی، قانونی یا پیسوں کا مشورہ نہیں دیتے۔ صحت کے کسی بھی سوال کے لیے اپنے GP، فارماسسٹ یا NHS 111 سے رجوع کریں۔ ہنگامی حالت میں 999 پر کال کریں۔", "terms.7": "قابلِ اعتماد پیشہ ور آزاد، خود روز र के लोग ख़ुशी से किसी भी ऐसे व्यक्ति का फ़ोन सुनने को तैयार हैं जो अकेला या परेशान महसूस करे। वे सदस्य नहीं हैं, इसलिए आपकी कोई बात समूह तक नहीं पहुँचती। हर बात पूरी तरह गोपनीय रहती है।", "listen.none": "उनके नंबर आयोजक यहाँ जोड़ेंगे।", "listen.hours": "आमतौर पर जवाब देते हैं:", "listen.editHead": "हमारे सुनने वाले (आयोजक)", "listen.editHint": "पहला नाम, फ़ोन नंबर और वे समय जब वे आमतौर पर जवाब देते हैं। ज़्यादा से ज़्यादा छह। ये नियम पेज और दूसरों के लिए खाना बनाना पेज पर दिखते हैं।", "listen.name": "पहला नाम", "listen.phone": "फ़ोन", "listen.hoursLabel": "समय (वैकल्पिक)", "listen.save": "सुनने वाले सेव करें", "listen.saved": "सुनने वाले सेव हो गए।", "talk.head": "किसी से बात करनी है?", "talk.text": "अगर आप उदास, अकेला या परेशान महसूस करें तो आप अकेले नहीं हैं। Samaritans किसी भी समय, मुफ़्त, 116 123 पर सुनते हैं। मानसिक स्वास्थ्य की तुरंत मदद के लिए NHS 111 पर कॉल करें और मानसिक स्वास्थ्य का विकल्प चुनें। आपात स्थिति में 999 पर कॉल करें।", "cook.title": "दूसरों के लिए खाना बनाना", "cook.lead": "हर उस व्यक्ति के लिए जो किसी दूसरे घर के लिए खाना बनाता है। कृपया इसे एक बार पढ़ें, और किसी नए व्यक्ति के लिए बनाने से पहले फिर से पढ़ें।", "cook.footer": "दूसरों के लिए खाना बनाना", "cook.hygHead": "खाने की स्वच्छता", "cook.hygText": "समूह में जो भी दूसरों के लिए खाना बनाता है उससे कहा जाता है कि पहले खाने की स्वच्छता का एक छोटा ऑनलाइन कोर्स पूरा करे। इसमें लगभग दो घंटे लगते हैं और यह सुरक्षित तरीक़े से रखना, पकाना, ठंडा करना और दोबारा गर्म करना सिखाता है।", "cook.hygLink": "लेवल 2 खाने की स्वच्छता और सुरक्षा कोर्स (High Speed Training) – नए टैब में खुलता है", "cook.hygFee": "कोर्स की फ़ीस आयोजक लौटाते हैं: पास होने के बाद रसीद आयोजक को भेजें। समूह में एक व्यक्ति जो यह कोर्स पहले ही पास कर चुका है, ख़ुशी से दूसरों की इसमें मदद करता है – आयोजक से पूछें कि कौन।", "cook.allHead": "खाने की आम एलर्जी वाली चीज़ें", "cook.allIntro": "यह उन खानों की आम सूची है जो अक्सर एलर्जी की प्रतिक्रिया पैदा करते हैं। कुछ ख़ास एलर्जी वाली चीज़ें इस सूची में न भी हों – हमेशा उस व्यक्ति से पूछें कि उसे किस चीज़ से बचना है, और शक हो तो उसके लिए खाना न बनाएँ। हमारा नियम बना रहता है: जिसे खाने से एलर्जी हो उसके लिए घर का बना खाना नहीं।", "cook.allNote": "पहली चौदह वे चीज़ें हैं जो ब्रिटेन के खाने के कारोबारों को क़ानूनन बतानी होती हैं; घर में बनाने वाले कारोबार नहीं हैं, लेकिन वही सावधानी लागू होती है।", "cook.diaHead": "मधुमेह (डायबिटीज़) वाले व्यक्ति के लिए खाना बनाना", "cook.diaText": "बहुत से सदस्य मधुमेह (डायबिटीज़) के साथ जीते हैं। यह चिकित्सा सलाह नहीं है – केवल बनाने वाले के लिए जानकारी है। उस व्यक्ति से पूछें कि वे आमतौर पर क्या खाते हैं और किस चीज़ से परहेज़ करते हैं; वे बेहतर जानते हैं। उन्हें साफ़-साफ़ बताएँ कि खाने में क्या है, ख़ासकर चीनी, शहद, सिरप, सफ़ेद चावल, सफ़ेद ब्रेड, आलू और मीठे पेय, और हिस्सा कितना बड़ा है। अपनी मर्ज़ी से किसी का खाना या दवाएँ न बदलें। स्वास्थ्य के किसी भी सवाल के लिए उस व्यक्ति को अपने GP, फ़ार्मासिस्ट या मधुमेह नर्स से पूछना चाहिए।", "cook.labelHead": "हर डिश पर लेबल लगाएँ", "cook.labelText": "हर डिश में क्या है यह एक कार्ड या स्टिकर पर लिखें: मुख्य सामग्री, ऊपर दी गई एलर्जी वाली चीज़ों में से कोई भी, और क्या इसमें चीनी है। खाने की सभाओं में हर डिश पर लेबल होता है, ताकि लोग सुरक्षित रूप से चुन सकें।", "cook.a1": "सेलेरी (अजमोद)", "cook.a1d": "सेलेरी की जड़ सहित, और स्टॉक क्यूब, सूप और नमक में सेलेरी", "cook.a2": "ग्लूटेन वाले अनाज", "cook.a2d": "गेहूँ, राई, जौ, जई और स्पेल्ट – ब्रेड, पास्ता, आटा, बैटर, कूसकूस, कई सॉस में", "cook.a3": "खोल वाले समुद्री जीव (झींगा, केकड़ा)", "cook.a3d": "झींगे, केकड़ा, लॉबस्टर, क्रेफ़िश, झींगा पेस्ट", "cook.a4": "अंडे", "cook.a4d": "केक, मेयोनेज़, पेस्ट्री की चमक, कुछ पास्ता और सॉस में भी", "cook.a5": "मछली", "cook.a5d": "फ़िश सॉस, वूस्टर सॉस, कुछ सलाद ड्रेसिंग में भी", "cook.a6": "ल्यूपिन", "cook.a6d": "कुछ ब्रेड, पेस्ट्री और पास्ता में", "cook.a7": "दूध", "cook.a7d": "मक्खन, चीज़, क्रीम, दही, घी, दूध पाउडर, व्हे सहित", "cook.a8": "नरम शरीर वाले समुद्री जीव (सीप, स्क्विड)", "cook.a8d": "मसल्स, स्क्विड, घोंघे, ऑयस्टर, ऑयस्टर सॉस", "cook.a9": "सरसों", "cook.a9d": "बीज, पाउडर, पत्ते, और करी, मैरिनेड, ड्रेसिंग में", "cook.a10": "मूँगफली", "cook.a10d": "मूँगफली का तेल, पीनट बटर, सटे, कई मिठाइयाँ और सॉस", "cook.a11": "तिल", "cook.a11d": "बीज, तेल, ताहिनी, हम्मस, कुछ ब्रेड", "cook.a12": "सोया", "cook.a12d": "सोया सॉस, टोफ़ू, एडामामे, सोया दूध, कुछ मीठे व्यंजन और सॉस", "cook.a13": "सल्फ़र डाइऑक्साइड और सल्फ़ाइट्स", "cook.a13d": "सूखे फल, कुछ मांस उत्पाद, सॉफ़्ट ड्रिंक, सिरका, वाइन में", "cook.a14": "पेड़ के मेवे", "cook.a14d": "बादाम, हेज़लनट, अखरोट, काजू, पीकन, ब्राज़ील नट, पिस्ता, मैकाडामिया – तेल, मार्ज़िपान, पेस्टो, सॉस में", "cook.a15": "दूसरी चीज़ें जिनसे लोग एलर्जी बताते हैं", "cook.a15d": "जैसे कीवी, केला, एवोकाडो, चने, दालें, कुछ मसाले, खाने के रंग – हमेशा पूछें", "allergy.all": "{name} के घर में सभी को खाने से एलर्जी है, इसलिए उस घर के लिए घर का बना खाना नहीं दिया जाता।", "allergy.some": "{name} के घर में किसी को खाने से एलर्जी है। उस व्यक्ति के लिए घर का बना खाना नहीं दिया जाता, लेकिन घर के उन {n} लोगों के लिए ख़ुशी से दिया जाता है जिन्हें खाने से एलर्जी नहीं है – कृपया हर डिश पर लिखें कि उसमें क्या है।", "allergy.some1": "{name} के घर में किसी को खाने से एलर्जी है। उस व्यक्ति के लिए घर का बना खाना नहीं दिया जाता, लेकिन घर के उस एक व्यक्ति के लिए ख़ुशी से दिया जाता है जिसे खाने से एलर्जी नहीं है – कृपया हर डिश पर लिखें कि उसमें क्या है।", "rules.10": "केवल माँगी गई या स्वीकार की गई मदद तक सीमित रहें। वेबसाइट, बोर्ड और समूह की चैट गपशप या आम चर्चा के लिए नहीं हैं।", "rules.11": "हर घर की निजता का कड़ाई से सम्मान किया जाता है। किसी के घर में आप जो देखें या सुनें वह वहीं रहता है, और कभी दूसरों से उस पर बात नहीं की जाती।", "rules.12": "कुत्ते टहलाने का कोई काम नहीं, और जिसे खाने से एलर्जी हो उसके लिए घर का बना खाना नहीं (उस घर के बाक़ी लोगों के लिए ख़ुशी से खाना बनाया जाता है)।", "priv.title": "गोपनीयता सूचना", "priv.lead": "यह वेबसाइट आपके बारे में क्या रखती है, क्यों, और कौन इसे देख सकता है। आसान शब्दों में लिखा हुआ।", "priv.footer": "गोपनीयता", "priv.h1": "हम क्या रखते हैं", "priv.t1": "आपका पहला नाम; सड़क का नाम और पोस्टकोड क्षेत्र जो आप देना चाहें; आपका ईमेल (पुष्टियों के लिए); परिवार का वह सदस्य या दोस्त जिसे आप सूचित रखना चाहें; खाने के सवाल का आपका जवाब; आप क्या पेश करते और माँगते हैं, और कब; धन्यवाद और असली ख़र्च; वे पेशेवर जिन्हें समूह इस्तेमाल करता है। और कुछ नहीं।", "priv.h2": "क्यों", "priv.t2": "ताकि सदस्य देख सकें कि कौन मदद पेश करता है और किसे चाहिए, ताकि पुष्टियाँ आप तक पहुँचें, ताकि पका हुआ खाना सुरक्षित रहे, और ताकि असली ख़र्च आयोजकों के ज़रिए लौटाया जाए। हम आपकी जानकारी समूह से बाहर किसी को कभी नहीं बेचते और न साझा करते हैं।", "priv.h3": "खाने का आपका जवाब", "priv.t3": "आपके घर में किसी को खाने से एलर्जी है या नहीं, यह स्वास्थ्य की जानकारी है। हम इसे केवल इसलिए रखते हैं कि आप बॉक्स पर निशान लगाकर अनुमति देते हैं, और केवल खाने को सुरक्षित रखने के लिए। इसे केवल आप और आयोजक देख सकते हैं; दूसरे सदस्य केवल “सुरक्षा कारणों से उपलब्ध नहीं” देखते हैं। आप इसे मेरा पेज पर कभी भी बदल या मिटा सकते हैं।", "priv.h4": "कौन क्या देख सकता है", "priv.t4": "सदस्य पहले नाम, सड़कों के नाम, पेशकश, अनुरोध और पेशेवर देखते हैं। आयोजक निमंत्रण कोड, ईमेल, परिवार के संपर्क, ख़र्च रजिस्टर, डायरी और समूह की देखभाल का पेज भी देखते हैं। समूह से बाहर कोई कुछ नहीं देखता।", "priv.h5": "कितने समय तक", "priv.t5": "जब तक आप सदस्य हैं, और आपके जाने के 12 महीने बाद तक (ताकि ख़र्च और धन्यवाद सही जुड़ें), फिर मिटा दिया जाता है। आयोजकों की डायरी समूह के पूरे जीवन तक रखी जाती है, नामों की जगह कोड के साथ।", "priv.h6": "पेशेवरों के काग़ज़ात", "priv.t6": "CV, पासपोर्ट और संदर्भ आयोजकों की ऑफ़लाइन बही में रखे जाते हैं, इस वेबसाइट पर नहीं।", "priv.h7": "आपके अधिकार", "priv.t7": "आप कभी भी आयोजकों से कह सकते हैं कि आपके बारे में जो रखा गया है वह दिखाएँ, उसे ठीक करें, या मिटा दें। बस कह दें।", "priv.h8": "सुरक्षा", "priv.t8": "वेबसाइट निजी है, केवल निमंत्रण कोड और वैकल्पिक PIN से खुलती है, रोज़ाना इसका बैकअप लिया जाता है, और यह कोई ट्रैकिंग या विज्ञापन कुकीज़ इस्तेमाल नहीं करती।", "terms.title": "उपयोग की शर्तें", "terms.lead": "हर सदस्य और समूह के बीच एक छोटा, सादा समझौता।", "terms.footer": "शर्तें", "terms.1": "Helping Hands एक स्वैच्छिक समूह है जिसमें लोग एक-दूसरे की मदद करते हैं। किसी को अपने समय के पैसे नहीं दिए जाते; केवल असली ख़र्च लौटाया जाता है, आयोजकों के बैंक खाते के ज़रिए, और कोई टिप न दी जाती है न ली जाती है।", "terms.2": "मदद करना हमेशा आपकी मर्ज़ी है, और माँगना भी। मना करना हमेशा ठीक है।", "terms.3": "वेबसाइट निजी है। अपना निमंत्रण कोड अपने पास रखें; इसे या वेबसाइट का पता समूह से बाहर किसी के साथ कभी साझा न करें।", "terms.4": "वेबसाइट केवल माँगी गई या स्वीकार की गई मदद के लिए इस्तेमाल करें – गपशप, बेचने, राजनीति या किसी और चीज़ के लिए नहीं।", "terms.5": "हर घर की निजता का सम्मान करें। किसी के घर में आप जो देखें या सुनें वह वहीं रहता है।", "terms.6": "हम चिकित्सा, क़ानूनी या पैसों की सलाह नहीं देते। स्वास्थ्य के किसी भी सवाल के लिए अपने GP, फ़ार्मासिस्ट या NHS 111 से संपर्क करें। आपात स्थिति में 999 पर कॉल करें।", "terms.7": "भरोसेमंद पेशेवर स्वतंत्र, स्व-रोज़गार लोग हैं जिन्हें आयोजकों ने जाँचा है। वे जो भी काम करें वह आपके और उनके बीच का समझौता है।", "terms.8": "आयोजक ऐसे अनुरोध, पेशेवर या सदस्य को हटा सकते हैं जो इन शर्तों को तोड़े, उनसे बात करने के बाद।", "terms.9": "वेबसाइट इस्तेमाल करके आप इन शर्तों और गोपनीयता सूचना से सहमत होते हैं।", "uc.title": "उपयोगी संपर्क", "uc.lead": "हमारे आसपास किसे फ़ोन करना है। यहाँ कुछ भी सलाह नहीं है – यह एक फ़ोन बुक है।", "uc.leadOrg": "केवल आयोजक के लिए, जब तक आप “सदस्यों को भी दिखाएँ” पर निशान न लगाएँ। जैसे-जैसे चीज़ें बदलें, जोड़ें, बदलें, हटाएँ और वापस लाएँ।", "uc.footer": "उपयोगी संपर्क", "uc.footerOrg": "उपयोगी संपर्क (आयोजक)", "uc.name": "नाम", "uc.phone": "फ़ोन", "uc.note": "एक लाइन (वैकल्पिक)", "uc.cat": "कौन सी सूची?", "uc.add": "जोड़ें", "uc.added": "जुड़ गया।", "uc.remove": "हटाएँ", "uc.restore": "वापस लाएँ", "uc.removed": "हटाया गया – वापस लाने के लिए “वापस लाएँ” दबाएँ।", "uc.show": "सदस्यों को भी दिखाएँ", "uc.showHint": "जब इस पर निशान हो तो सदस्य भी उपयोगी संपर्क पेज देखते हैं (जोड़ें, हटाएँ और वापस लाएँ बटनों के बिना)।", "uc.none": "यहाँ अभी कुछ नहीं है।", "uc.c.emergency": "आपात स्थितियाँ", "uc.c.health": "अस्पताल, GP सर्जरी और फ़ार्मेसी", "uc.c.faith": "धर्मगुरु और पूजा स्थल", "uc.c.funeral": "जब किसी का निधन हो जाए", "uc.c.shops": "स्थानीय दुकानें जो डिलीवरी करती हैं या ऑर्डर लेती हैं", "uc.c.council": "काउंसिल, पुलिस (ग़ैर-आपात) और सलाह", "uc.c.transport": "परिवहन", "uc.c.support": "सहारा और साथ", "uc.c.school": "स्कूल और पुस्तकालय", "uc.c.other": "अन्य", "journal.title": "आयोजकों की डायरी", "journal.lead": "आयोजकों के बीच एक निजी रोज़ाना बातचीत कि समूह कैसे चल रहा है और समस्याएँ कैसे सुलझीं। यह हमेशा के लिए रखी जाती है – कुछ भी मिटाया नहीं जा सकता – ताकि बाद के आयोजक शुरुआती दिक़्क़तें और उनके हल देख सकें। प्रविष्टियों पर नाम नहीं, कोड से हस्ताक्षर होते हैं।", "journal.footer": "आयोजकों की डायरी (आयोजक)", "journal.you": "आप {code} के रूप में लिखते हैं", "journal.youNew": "जब आप अपना पहला नोट लिखेंगे तो आपको कोड दिया जाएगा।", "journal.whoHint": "हर आयोजक को पहली बार लिखने के क्रम में एक कोड मिलता है: A1, B2, C3, D4, E5। सदस्य यह पेज कभी नहीं देखते, और यहाँ नाम कभी नहीं दिखाए जाते।", "journal.write": "आज का नोट लिखें", "journal.ph": "आज क्या हुआ? क्या काम आया, क्या नहीं, क्या तय हुआ?", "journal.post": "डायरी में जोड़ें", "journal.posted": "जुड़ गया। इसे मिटाया नहीं जा सकता।", "journal.keep": "प्रविष्टियाँ बदली या मिटाई नहीं जा सकतीं। अगर कुछ ग़लत था तो एक नया नोट लिखकर बताएँ।", "journal.todayDone": "आज लिखा गया ✔", "journal.todayNot": "आज अभी तक नहीं लिखा", "journal.todayHint": "आयोजक हर दिन कुछ न कुछ लिखने की कोशिश करते हैं, चाहे एक लाइन ही हो।", "journal.entries": "{n} प्रविष्टियाँ", "journal.none": "अभी तक कुछ नहीं लिखा गया।", "journal.search": "डायरी में खोजें", "for.badgeFor": "यह अनुरोध {f} के लिए है, {by} ने किया।", "for.close": "बंद करें", "footer.privacy": "गोपनीयता", "footer.terms": "शर्तें", "general.tapAgain": "पक्का? फिर से टैप करें", "general.remove": "हटाएँ", "general.restore": "वापस लाएँ", "conf.emailNeeded": "पुष्टियों के लिए ईमेल (ज़रूरी)", "conf.emailHint2": "कृपया ईमेल पता दें, ताकि हर अनुरोध और पेशकश का रिकॉर्ड रहे। हर पुष्टि एक या दो वाक्यों का छोटा ईमेल होती है – इसस ook.hygFee": "કોર્સની ફી આયોજક પાછી આપે છે: પાસ થયા પછી રસીદ આયોજકને મોકલો. જૂથમાં એક વ્યક્તિ જે આ કોર્સ પહેલેથી પાસ કરી ચૂકી છે તે રાજીખુશીથી બીજાઓને તેમાં મદદ કરે છે – આયોજકને પૂછો કે કોણ.", "cook.allHead": "ખોરાકની સામાન્ય એલર્જી કરનારી ચીજો", "cook.allIntro": "આ એવા ખોરાકની સામાન્ય યાદી છે જે મોટે ભાગે એલર્જીની પ્રતિક્રિયા કરે છે. કેટલીક ખાસ એલર્જી કરનારી ચીજો આ યાદીમાં ન પણ હોય – હંમેશાં તે વ્યક્તિને પૂછો કે તેમણે શેનાથી દૂર રહેવાનું છે, અને શંકા હોય તો તેમના માટે રસોઈ ન કરો. આપણો નિયમ યથાવત રહે છે: જેને ખોરાકની એલર્જી હોય તેના માટે ઘરનું બનાવેલું ભોજન નહીં.", "cook.allNote": "પહેલી ચૌદ એવી ચીજો છે જે યુકેના ખોરાકના ધંધાઓએ કાયદા મુજબ જાહેર કરવી પડે છે; ઘરના રસોઈયા ધંધો નથી, પણ એ જ કાળજી લાગુ પડે છે.", "cook.diaHead": "ડાયાબિટીસવાળી વ્યક્તિ માટે રસોઈ", "cook.diaText": "ઘણા સભ્યો ડાયાબિટીસ સાથે જીવે છે. આ તબીબી સલાહ નથી – ફક્ત રસોઈ કરનાર માટે જાણકારી છે. તે વ્યક્તિને પૂછો કે તેઓ સામાન્ય રીતે શું ખાય છે અને શેનાથી દૂર રહે છે; તેઓ વધુ સારી રીતે જાણે છે. તેમને સ્પષ્ટ રીતે જણાવો કે વાનગીમાં શું છે, ખાસ કરીને ખાંડ, મધ, સિરપ, સફેદ ચોખા, સફેદ બ્રેડ, બટાકા અને મીઠાં પીણાં, અને ભાગ કેટલો મોટો છે. પોતાની મરજીથી કોઈનો ખોરાક કે દવાઓ ન બદલો. સ્વાસ્થ્યના કોઈ પણ પ્રશ્ન માટે તે વ્યક્તિએ પોતાના GP, ફાર્માસિસ્ટ કે ડાયાબિટીસ નર્સને પૂછવું જોઈએ.", "cook.labelHead": "દરેક વાનગી પર લેબલ લગાવો", "cook.labelText": "દરેક વાનગીમાં શું છે તે એક કાર્ડ કે સ્ટિકર પર લખો: મુખ્ય સામગ્રી, ઉપર આપેલી એલર્જી કરનારી ચીજોમાંથી કોઈ પણ, અને તેમાં ખાંડ છે કે નહીં. ભોજન મેળાવડાઓમાં દરેક વાનગી પર લેબલ હોય છે, જેથી લોકો સુરક્ષિત રીતે પસંદ કરી શકે.", "cook.a1": "સેલરી", "cook.a1d": "સેલરીનું મૂળ સહિત, અને સ્ટૉક ક્યૂબ, સૂપ અને મીઠામાં સેલરી", "cook.a2": "ગ્લુટેનવાળાં અનાજ", "cook.a2d": "ઘઉં, રાય (એક અનાજ), જવ, ઓટ્સ અને સ્પેલ્ટ – બ્રેડ, પાસ્તા, લોટ, બૅટર, કુસકુસ, ઘણી સૉસમાં", "cook.a3": "કવચવાળા દરિયાઈ જીવ (ઝીંગા, કરચલા)", "cook.a3d": "ઝીંગા, કરચલો, લૉબસ્ટર, ક્રેફિશ, ઝીંગાની પેસ્ટ", "cook.a4": "ઈંડાં", "cook.a4d": "કેક, મેયોનેઝ, પેસ્ટ્રીની ચમક, કેટલાક પાસ્તા અને સૉસમાં પણ", "cook.a5": "માછલી", "cook.a5d": "ફિશ સૉસ, વુસ્ટર સૉસ, કેટલીક સલાડ ડ્રેસિંગમાં પણ", "cook.a6": "લ્યુપિન", "cook.a6d": "કેટલીક બ્રેડ, પેસ્ટ્રી અને પાસ્તામાં", "cook.a7": "દૂધ", "cook.a7d": "માખણ, ચીઝ, ક્રીમ, દહીં, ઘી, દૂધ પાઉડર, વ્હે સહિત", "cook.a8": "નરમ શરીરવાળા દરિયાઈ જીવ (છીપ, સ્ક્વિડ)", "cook.a8d": "મસલ્સ, સ્ક્વિડ, ગોકળગાય, ઑઇસ્ટર, ઑઇસ્ટર સૉસ", "cook.a9": "રાઈ (સરસવ)", "cook.a9d": "બીજ, પાઉડર, પાંદડાં, અને કરી, મેરિનેડ, ડ્રેસિંગમાં", "cook.a10": "મગફળી", "cook.a10d": "મગફળીનું તેલ, પીનટ બટર, સાટે, ઘણી મીઠાઈઓ અને સૉસ", "cook.a11": "તલ", "cook.a11d": "બીજ, તેલ, તાહિની, હમસ, કેટલીક બ્રેડ", "cook.a12": "સોયા", "cook.a12d": "સોયા સૉસ, ટોફુ, એડામામે, સોયા દૂધ, કેટલીક મીઠાઈઓ અને સૉસ", "cook.a13": "સલ્ફર ડાયોક્સાઇડ અને સલ્ફાઇટ્સ", "cook.a13d": "સૂકાં ફળ, કેટલીક માંસની બનાવટો, સૉફ્ટ ડ્રિંક, સરકો, વાઇનમાં", "cook.a14": "ઝાડના સૂકા મેવા", "cook.a14d": "બદામ, હેઝલનટ, અખરોટ, કાજુ, પીકન, બ્રાઝિલ નટ, પિસ્તા, મેકાડેમિયા – તેલ, માર્ઝિપાન, પેસ્ટો, સૉસમાં", "cook.a15": "બીજી ચીજો જેની લોકો એલર્જી જણાવે છે", "cook.a15d": "જેમ કે કીવી, કેળું, એવોકાડો, ચણા, દાળ, અમુક મસાલા, ખાદ્ય રંગ – હંમેશાં પૂછો", "allergy.all": "{name} ના ઘરમાં બધાને ખોરાકની એલર્જી છે, તેથી તે ઘર માટે ઘરનું બનાવેલું ભોજન અપાતું નથી.", "allergy.some": "{name} ના ઘરમાં કોઈને ખોરાકની એલર્જી છે. તે વ્યક્તિ માટે ઘરનું બનાવેલું ભોજન અપાતું નથી, પણ ઘરના તે {n} લોકો માટે રાજીખુશીથી અપાય છે જેમને ખોરાકની એલર્જી નથી – કૃપા કરીને દરેક વાનગી પર લખો કે તેમાં શું છે.", "allergy.some1": "{name} ના ઘરમાં કોઈને ખોરાકની એલર્જી છે. તે વ્યક્તિ માટે ઘરનું બનાવેલું ભોજન અપાતું નથી, પણ ઘરની તે એક વ્યક્તિ માટે રાજીખુશીથી અપાય છે જેને ખોરાકની એલર્જી નથી – કૃપા કરીને દરેક વાનગી પર લખો કે તેમાં શું છે.", "rules.10": "ફક્ત માંગેલી કે સ્વીકારેલી મદદ પૂરતા જ રહો. વેબસાઇટ, બોર્ડ અને જૂથની ચૅટ ગપસપ કે સામાન્ય ચર્ચા માટે નથી.", "rules.11": "દરેક ઘરની ગોપનીયતાનું કડક રીતે માન રખાય છે. કોઈના ઘરમાં તમે જે જુઓ કે સાંભળો તે ત્યાં જ રહે છે, અને ક્યારેય બીજાઓ સાથે તેની ચર્ચા થતી નથી.", "rules.12": "કૂતરા ફેરવવાનું કામ નહીં, અને જેને ખોરાકની એલર્જી હોય તેના માટે ઘરનું બનાવેલું ભોજન નહીં (તે ઘરના બાકીના લોકો માટે રાજીખુશીથી રસોઈ કરાય છે).", "priv.title": "ગોપનીયતા સૂચના", "priv.lead": "આ વેબસાઇટ તમારા વિશે શું રાખે છે, શા માટે, અને કોણ તે જોઈ શકે છે. સરળ શબ્દોમાં લખેલું.", "priv.footer": "ગોપનીયતા", "priv.h1": "અમે શું રાખીએ છીએ", "priv.t1": "તમારું પહેલું નામ; શેરીનું નામ અને પોસ્ટકોડ વિસ્તાર જે તમે આપવા માંગો; તમારો ઈમેલ (પુષ્ટિઓ માટે); પરિવારની તે વ્યક્તિ કે મિત્ર જેને તમે માહિતગાર રાખવા માંગો; ખોરાકના પ્રશ્નનો તમારો જવાબ; તમે શું ઓફર કરો છો અને માંગો છો, અને ક્યારે; આભાર અને ખરો ખર્ચ; જૂથ જે વ્યાવસાયિકોનો ઉપયોગ કરે છે તે. બીજું કંઈ નહીં.", "priv.h2": "શા માટે", "priv.t2": "જેથી સભ્યો જોઈ શકે કે કોણ મદદ ઓફર કરે છે અને કોને જોઈએ છે, જેથી પુષ્ટિઓ તમારા સુધી પહોંચે, જેથી રાંધેલું ખાવાનું સુરક્ષિત રહે, અને જેથી ખરો ખર્ચ આયોજકો દ્વારા પાછો અપાય. અમે તમારી વિગતો જૂથ બહાર કોઈને ક્યારેય વેચતા નથી કે વહેંચતા નથી.", "priv.h3": "ખોરાકનો તમારો જવાબ", "priv.t3": "તમારા ઘરમાં કોઈને ખોરાકની એલર્જી છે કે નહીં, તે સ્વાસ્થ્યની માહિતી છે. અમે તે ફક્ત એટલા માટે રાખીએ છીએ કે તમે બોક્સ પર નિશાન કરીને મંજૂરી આપો છો, અને ફક્ત ખોરાક સુરક્ષિત રાખવા માટે. તેને ફક્ત તમે અને આયોજકો જ જોઈ શકો છો; બીજા સભ્યો ફક્ત “સલામતીનાં કારણોસર ઉપલબ્ધ નથી” જુએ છે. તમે તેને મારું પેજ પર ગમે ત્યારે બદલી કે ભૂંસી શકો છો.", "priv.h4": "કોણ શું જોઈ શકે છે", "priv.t4": "સભ્યો પહેલાં નામ, શેરીઓનાં નામ, ઓફર, વિનંતીઓ અને વ્યાવસાયિકો જુએ છે. આયોજકો આમંત્રણ કોડ, ઈમેલ, પરિવારના સંપર્કો, ખર્ચ રજિસ્ટર, ડાયરી અને જૂથની સંભાળનું પેજ પણ જુએ છે. જૂથ બહાર કોઈ કંઈ જોતું નથી.", "priv.h5": "કેટલો સમય", "priv.t5": "જ્યાં સુધી તમે સભ્ય છો, અને તમે છોડ્યા પછી 12 મહિના સુધી (જેથી ખર્ચ અને આભાર બરાબર ગણાય), પછી ભૂંસી નખાય છે. આયોજકોની ડાયરી જૂથના આખા જીવન સુધી રખાય છે, નામોની જગ્યાએ કોડ સાથે.", "priv.h6": "વ્યાવસાયિકોના કાગળો", "priv.t6": "CV, પાસપોર્ટ અને સંદર્ભો આયોજકોના ઑફલાઇન ચોપડામાં રખાય છે, આ વેબસાઇટ પર નહીં.", "priv.h7": "તમારા હક", "priv.t7": "તમે ગમે ત્યારે આયોજકોને કહી શકો છો કે તમારા વિશે જે રખાયું છે તે બતાવે, તે સુધારે, કે ભૂંસી નાખે. બસ કહી દો.", "priv.h8": "સલામતી", "priv.t8": "વેબસાઇટ ખાનગી છે, ફક્ત આમંત્રણ કોડ અને વૈકલ્પિક PIN થી જ ખુલે છે, દરરોજ તેનો બૅકઅપ લેવાય છે, અને તે કોઈ ટ્રૅકિંગ કે જાહેરાતની કૂકીઝ વાપરતી નથી.", "terms.title": "ઉપયોગની શરતો", "terms.lead": "દરેક સભ્ય અને જૂથ વચ્ચેનો એક ટૂંકો, સાદો કરાર.", "terms.footer": "શરતો", "terms.1": "Helping Hands એક સ્વૈચ્છિક જૂથ છે જેમાં લોકો એકબીજાને મદદ કરે છે. કોઈને પોતાના સમયના પૈસા અપાતા નથી; ફક્ત ખરો ખર્ચ પાછો અપાય છે, આયોજકોના બેંક ખાતા દ્વારા, અને કોઈ ટિપ અપાતી નથી કે લેવાતી નથી.", "terms.2": "મદદ કરવી હંમેશાં તમારી પસંદગી છે, અને માંગવી પણ. ના કહેવું હંમેશાં ઠીક છે.", "terms.3": "વેબસાઇટ ખાનગી છે. તમારો આમંત્રણ કોડ તમારી પાસે જ રાખો; તેને કે વેબસાઇટનું સરનામું જૂથ બહાર કોઈ સાથે ક્યારેય વહેંચશો નહીં.", "terms.4": "વેબસાઇટ ફક્ત માંગેલી કે સ્વીકારેલી મદદ માટે જ વાપરો – ગપસપ, વેચાણ, રાજકારણ કે બીજા કશા માટે નહીં.", "terms.5": "દરેક ઘરની ગોપનીયતાનું માન રાખો. કોઈના ઘરમાં તમે જે જુઓ કે સાંભળો તે ત્યાં જ રહે છે.", "terms.6": "અમે તબીબી, કાનૂની કે પૈસાની સલાહ આપતા નથી. સ્વાસ્થ્યના કોઈ પણ પ્રશ્ન માટે તમારા પોતાના GP, ફાર્માસિસ્ટ કે NHS 111 નો સંપર્ક કરો. કટોકટીમાં 999 પર કૉલ કરો.", "terms.7": "ભરોસાપાત્ર વ્યાવસાયિકો સ્વતંત્ર, સ્વ-રોજગાર લોકો છે જેમને આયોજકોએ તપાસ્યા છે. તેઓ જે પણ કામ કરે તે તમારી અને તેમની વચ્ચેનો કરાર છે.", "terms.8": "આયોજકો એવી વિનંતી, વ્યાવસાયિક કે સભ્યને દૂર કરી શકે છે જે આ શરતો તોડે, તેમની સાથે વાત કર્યા પછી.", "terms.9": "વેબસાઇટ વાપરીને તમે આ શરતો અને ગોપનીયતા સૂચના સાથે સંમત થાઓ છો.", "uc.title": "ઉપયોગી સંપર્કો", "uc.lead": "આપણી આસપાસ કોને ફોન કરવો. અહીં કંઈ સલાહ નથી – આ એક ફોન બુક છે.", "uc.leadOrg": "ફક્ત આયોજક માટે, જ્યાં સુધી તમે “સભ્યોને પણ બતાવો” પર નિશાન ન કરો. જેમ જેમ વસ્તુઓ બદલાય, ઉમેરો, બદલો, દૂર કરો અને પાછું લાવો.", "uc.footer": "ઉપયોગી સંપર્કો", "uc.footerOrg": "ઉપયોગી સંપર્કો (આયોજક)", "uc.name": "નામ", "uc.phone": "ફોન", "uc.note": "એક લીટી (વૈકલ્પિક)", "uc.cat": "કઈ યાદી?", "uc.add": "ઉમેરો", "uc.added": "ઉમેરાયું.", "uc.remove": "દૂર કરો", "uc.restore": "પાછું લાવો", "uc.removed": "દૂર કર્યું – પાછું લાવવા માટે “પાછું લાવો” દબાવો.", "uc.show": "સભ્યોને પણ બતાવો", "u   const anyone=st.who[k].has(0)||!st.who[k].size;const who=[...st.who[k]].filter(x=>x).map(id=>(PEOPLE.find(p=>p.id===id)||{}).name).filter(Boolean).join(", ");st.from[k]=$("#from-"+k).value;st.until[k]=$("#until-"+k).value;st.open[k]=$("#open-"+k).checked;const when=whenText(k,$("#when-"+k).value.trim());
  const forId=k==="need"?st.forWho:0,forName=forId?behalfName(forId):"";[...st.pick[k]].forEach(i=>st.saved[k].push({t:ITEMS[i].label,ic:ITEMS[i].icon,anyone,who,when,forName}));if(other)st.saved[k].push({t:other,ic:"heart",anyone,who,when,forName});
  if(k==="need"){[...st.pick[k]].forEach(i=>MYREQ.push({id:Date.now()+i,t:ITEMS[i].label,ic:ITEMS[i].icon,who:anyone?t("form.anyone"):who,when,status:"open"}));if(other)MYREQ.push({id:Date.now()+999,t:other,ic:"heart",who:anyone?t("form.anyone"):who,when,status:"open"});}
  st.lastFor=forId?PEOPLE.find(p=>p.id===forId):null;st.last={k,text:confText(k,[...st.pick[k]].map(i=>tI(ITEMS[i].label)).concat(other?[other]:[]),who,when,anyone)};

 if(d.awaysave!==undefined){const f=$("#awayfrom").value,to=$("#awayto").value;if(!f||!to||new Date(to)<new Date(f)||new Date(to)<today()){$("#awayerr").hidden=false;return}const pf=new Date(f+"T00:00:00"),pt=new Date(to+"T00:00:00");SELF.away={from:pf.getTime(),to:pt.getTime()};draw();return}

draw();
